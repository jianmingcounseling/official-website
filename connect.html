<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>參與連結 | 漸明諮商所</title>
  <meta name="description" content="活動日曆、本月活動、活動側記與異業合作,實體與網站的交會處。" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-bar">
      <a href="index.html" class="logo">漸明</a>
      <button class="nav-toggle" aria-label="開啟選單" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-menu">
        <a href="index.html">首頁</a>
        <a href="about.html">認識我們</a>
        <a href="explore.html">探索理解</a>
        <a href="connect.html" class="active">參與連結</a>
        <a href="services.html">心理服務</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>參與連結</h1>
        <p class="subtitle">網站與實體空間交會的位置,以文化、心理與生活取向為核心。</p>
      </div>
    </section>

    <section id="this-month" class="section">
      <div class="container">
        <h2>本月活動</h2>
        <div class="card-grid">
          <article class="card event-card">
            <p class="card-meta">活動日期待補</p>
            <h3>活動名稱待補</h3>
            <p>活動介紹待補。</p>
            <a href="#" class="btn btn-primary">報名連結</a>
          </article>
        </div>
      </div>
    </section>

    <section id="calendar" class="section section-alt">
      <div class="container">
        <h2>活動日曆</h2>
        <p class="section-lead">每月更新的活動列表。</p>
        <ul class="timeline">
          <li class="timeline-item">
            <span class="timeline-date">日期待補</span>
            <p>活動名稱與簡介待補。</p>
          </li>
        </ul>
      </div>
    </section>

    <section id="recap" class="section">
      <div class="container">
        <h2>活動側記</h2>
        <p class="section-lead">圖文紀錄、照片與參與者回饋,活動結束後更新。</p>
        <div class="card-grid">
          <article class="card">
            <h3>活動側記標題待補</h3>
            <p>內容待補。</p>
          </article>
        </div>
      </div>
    </section>

    <section id="collab" class="section section-alt">
      <div class="container">
        <h2>合作企劃</h2>
        <p class="section-lead">與異業、空間或社區的合作專案。</p>
        <div class="card-grid">
          <article class="card">
            <h3>合作專案標題待補</h3>
            <p>內容待補。</p>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> 漸明諮商所. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
